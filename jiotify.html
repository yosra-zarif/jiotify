<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>AquaFraud</title>

<!-- 1. STYLE : l'apparence de la page -->
<style>
  body { font-family: Arial, sans-serif; background: #f3f6f8; padding: 20px; }
  h1, h2 { color: #087e8b; }
  #logo { height: 60px; border-radius: 10px; vertical-align: middle; }
  .carte { background: white; padding: 20px; border-radius: 10px; width: 48%; display: inline-block; vertical-align: top; box-sizing: border-box; }
  table { width: 100%; text-align: center; border-collapse: collapse; }
  td, th { padding: 8px; border-bottom: 1px solid #ddd; }
  select, input, button { width: 100%; padding: 10px; margin: 5px 0 12px; box-sizing: border-box; }
  button { background: #087e8b; color: white; border: 0; }
</style>
</head>
<body>

<!-- 2. PAGE : ce que l'on voit -->
<div><img id="logo"> <h1 style="display: inline">AquaFraud</h1></div><br>
<div class="carte">
  <h2>Consommation des fermes</h2>
  <table id="tableau"></table>
</div>

<div class="carte">
  <h2>Calcul de l'écart</h2>
  Choisir la ferme
  <select id="liste" onchange="remplirChamps()"></select>
  Consommation prévue
  <input id="prevue" type="number">
  Consommation réelle
  <input id="reelle" type="number">
  <button onclick="calculer()">Calculer</button>
  <p id="ecart"></p>
  <p id="message"></p>
</div>

<!-- 3. CODE : ce qui fait fonctionner la page -->
<script>
// Les données des fermes
var fermes = [
  { nom: "Ferme A", prevue: 100, reelle: 180 },
  { nom: "Ferme B", prevue: 150, reelle: 160 },
  { nom: "Ferme C", prevue: 120, reelle: 40 }
];

// Remplit le tableau et la liste des fermes
function afficherFermes() {
  var tableau = document.getElementById("tableau");
  var liste = document.getElementById("liste");
  tableau.innerHTML = "<tr><th>Ferme</th><th>Prévue</th><th>Réelle</th></tr>";
  for (var i = 0; i < fermes.length; i++) {
    tableau.innerHTML += "<tr><td>" + fermes[i].nom + "</td><td>" + fermes[i].prevue + "</td><td>" + fermes[i].reelle + "</td></tr>";
    liste.innerHTML += "<option value='" + i + "'>" + fermes[i].nom + "</option>";
  }
}

// Met les chiffres de la ferme choisie dans les deux champs
function remplirChamps() {
  var ferme = fermes[document.getElementById("liste").value];
  document.getElementById("prevue").value = ferme.prevue;
  document.getElementById("reelle").value = ferme.reelle;
}

// Calcule l'écart : il y a un problème seulement si réelle > prévue
function calculer() {
  var prevue = Number(document.getElementById("prevue").value);
  var reelle = Number(document.getElementById("reelle").value);
  var ecart = reelle - prevue;
  var pourcentage = ecart / prevue * 100;
  var message, couleur;

  if (ecart <= 0) {
    message = "Pas de problème"; couleur = "green";
  } else if (pourcentage < 15) {
    message = "Problème : risque faible"; couleur = "goldenrod";
  } else if (pourcentage < 50) {
    message = "Problème : risque moyen"; couleur = "orange";
  } else {
    message = "Problème : risque élevé"; couleur = "red";
  }

  document.getElementById("ecart").innerHTML = "<b>Écart :</b> " + ecart + " (" + pourcentage.toFixed(0) + "%)";
  document.getElementById("message").style.color = couleur;
  document.getElementById("message").innerHTML = message;
}

afficherFermes();
remplirChamps();
</script>
